apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hotel-management-test

resources:
- ../../base

namePrefix: test-

commonLabels:
  environment: test

images:
- name: hotel-management
  newTag: test-latest

patchesStrategicMerge:
- deployment-patch.yaml
- ingress-patch.yaml
- hpa-patch.yaml

configMapGenerator:
- name: hotel-management-config
  behavior: merge
  literals:
  - DEBUG=True
  - ALLOWED_HOSTS=test-hotel.yourdomain.com,localhost,127.0.0.1

secretGenerator:
- name: hotel-management-secrets
  behavior: merge
  literals:
  - DJANGO_SECRET_KEY=test-secret-key-change-in-production 