apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hotel-management-prod

resources:
- ../../base

namePrefix: prod-

commonLabels:
  environment: production

images:
- name: hotel-management
  newTag: prod-latest

patchesStrategicMerge:
- deployment-patch.yaml
- ingress-patch.yaml
- hpa-patch.yaml
- postgres-deployment.yaml
- postgres-service.yaml

configMapGenerator:
- name: hotel-management-config
  behavior: merge
  literals:
  - DEBUG=False
  - ALLOWED_HOSTS=hotel.yourdomain.com
  - DATABASE_ENGINE=django.db.backends.postgresql
  - DATABASE_HOST=prod-postgres-service
  - DATABASE_PORT=5432
  - DATABASE_NAME=hotel_management
  - DATABASE_USER=hotel_user

secretGenerator:
- name: hotel-management-secrets
  behavior: merge
  files:
  - secrets.env  # File containing production secrets 