apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hotel-management-ingress
  namespace: hotel-management-prod
  annotations:
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  tls:
  - hosts:
    - hotel.yourdomain.com
    secretName: prod-hotel-management-tls
  rules:
  - host: hotel.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: prod-hotel-management-service
            port:
              number: 80 