apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hotel-management-ingress
  namespace: hotel-management
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - hotel-management.example.com  # Will be overridden by environment
    secretName: hotel-management-tls
  rules:
  - host: hotel-management.example.com  # Will be overridden by environment
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: hotel-management-service
            port:
              number: 80 