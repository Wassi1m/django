apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-management-app
  namespace: hotel-management
  labels:
    app: hotel-management
    component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hotel-management
      component: web
  template:
    metadata:
      labels:
        app: hotel-management
        component: web
    spec:
      containers:
      - name: django-app
        image: hotel-management:latest
        ports:
        - containerPort: 8000
          name: http
        envFrom:
        - configMapRef:
            name: hotel-management-config
        - secretRef:
            name: hotel-management-secrets
        env:
        - name: DATABASE_URL
          value: "sqlite:///app/db.sqlite3"  # Will be overridden for prod
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /admin/login/
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /admin/login/
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: media-storage
          mountPath: /app/media
        - name: static-storage
          mountPath: /app/staticfiles
      volumes:
      - name: media-storage
        emptyDir: {}
      - name: static-storage
        emptyDir: {}
      restartPolicy: Always 